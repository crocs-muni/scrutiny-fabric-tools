name: CI

# Work reaches main only through a pull request (DECISIONS, "Working conventions"),
# so the pull_request trigger is the gate. The push trigger re-runs the same checks
# on the merge commit.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # rules.ts is generated from the spec's Appendix F (D35). CI fails if the
      # committed copy has drifted from tools/rules.json.
      - name: Rule registry is in sync
        run: pnpm rules:check

      - name: Build
        run: pnpm build

      - name: Exports map is ATTW-clean
        run: pnpm attw

      - name: Test
        run: pnpm test
