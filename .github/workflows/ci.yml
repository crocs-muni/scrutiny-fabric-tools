name: CI

# Work reaches main only through a pull request (DECISIONS, "Working conventions"),
# so the pull_request trigger is the gate. The push trigger re-runs the same checks
# on the merge commit.
#
# Two separate hazards, both hit while landing the Phase 2/3 stack:
#
# 1. `pull_request` is deliberately *unfiltered* by base branch. A `branches: [main]`
#    filter looks right and silently skips every stacked PR: phase N+1 opened against
#    phase N's branch gets no checks at all. Observed on PR #2, which had zero checks
#    until it was closed and reopened.
#
# 2. `edited` is in the type list because a PR's base can change. Retargeting a stacked
#    PR from phase N's branch to main alters the merge commit Actions tests against,
#    but emits only `pull_request.edited` — NOT `synchronize`, despite what the event
#    name suggests. Verified on PR #2: the retarget produced no run at a time when the
#    base filter would have matched, so a synchronize plainly never fired. Without this
#    the PR keeps a green check computed against a base it is no longer merging into.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # `edited` also fires for title and description edits, where nothing under test has
    # changed. `changes.base` is present only when the base branch itself moved, which is
    # the one edit that invalidates a previous run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'edited' ||
      github.event.changes.base != null
    name: verify (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One step, not six: `pnpm verify` is the documented gate, and re-listing its steps here
      # means a phase that extends it (Phase 7 adds coverage:rules and vectors:verify) passes CI
      # while the gate itself has grown. It runs lint, typecheck, rules:check, build, attw, test.
      - name: Verify
        run: pnpm verify

  # Static analysis of this file itself. A separate job, not a `pnpm verify` step: it scans YAML,
  # not package code, and needs no Node/pnpm setup at all.
  zizmor:
    name: zizmor (workflow security lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: pipx run zizmor .github/workflows/

  # Changesets record intent at PR time, not reconstructable from the diff after the fact — hence
  # its own job, gated to pull requests only (comparing `--since=main` on a push to main is a
  # trivial no-op). `fetch-depth: 0` because `changeset status` needs the full history to diff
  # against `main`, unlike `verify`'s shallow checkout.
  changesets:
    name: changeset presence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `changeset status --since=main` needs a local `main` ref; PR checkouts only have origin/main.
      - run: git branch -f main origin/main

      - run: pnpm changeset:check

  # Examples are not workspace members; core is built first so subpath exports resolve to dist/*.
  verify-examples:
    name: verify examples (signers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/signers/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C packages/core build

      - run: pnpm -C examples/signers install --frozen-lockfile

      - run: pnpm -C examples/signers typecheck

      - run: pnpm -C examples/signers test
