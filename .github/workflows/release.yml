name: release

# Publishes one package from its version tag: @crocs-muni/scrutiny-fabric (core) or
# @crocs-muni/scrutiny-fabric-mcp. The tag names the package.
#
# Trigger: a tag of the form `@crocs-muni/scrutiny-fabric@0.1.1` or
# `@crocs-muni/scrutiny-fabric-mcp@0.1.0` (the changesets tag format).
# Tags are created by a human publisher after the version PR merges:
#
#   pnpm changeset tag        # in the working tree on main (the version PR bumped versions)
#   git push origin '@crocs-muni/scrutiny-fabric@*' '@crocs-muni/scrutiny-fabric-mcp@*'
#
# The MCP package depends on core by `workspace:*`, which `pnpm pack` pins to core's current
# version; that version must already be on npm, so core's tag goes first (the job checks).
#
# `changeset version` (which runs inside the version PR) never tags; only `changeset tag`
# or `changeset publish` create the `<name>@<version>` tags, and `changeset publish` is
# deliberately not used: with OIDC configured, its `_authToken` injection bypasses the npm
# CLI's own OIDC exchange and the registry PUT fails E404 (changesets/changesets#1914).
# Plain `npm publish` lets the CLI do the exchange itself.
#
# No `workflow_dispatch`: a release is a tag push. Dispatching after a release would
# re-attempt an already-published version (E409), and a failed tag run can be re-run from
# its own run page, which keeps the tag ref.
#
# No NPM_TOKEN: publishing uses npm trusted publishing (OIDC) — the npm registry holds a
# trusted-publisher entry for THIS workflow in THIS repo (Settings → Trusted publishing on
# the package page), and `id-token: write` below is what lets GitHub mint the token npm
# validates. Provenance is automatic for OIDC publishes from public repos (npm ≥11.5.1);
# `pnpm install --frozen-lockfile` is what makes the attestation verifiable.
#
# The FIRST publish of each package (which creates it) cannot go through OIDC — it is done
# once manually by an org member with 2FA. Everything after this runs on tags.

on:
  push:
    tags:
      - '@crocs-muni/scrutiny-fabric@*'
      - '@crocs-muni/scrutiny-fabric-mcp@*'

permissions:
  contents: read
  id-token: write # required for OIDC → npm trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag names the package and its version. A tag that disagrees with the manifest would
      # otherwise publish whatever the manifest says (or fail E409 mid-PUT), so fail here,
      # before any install and before touching the registry.
      - name: Package from tag
        id: pkg
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME##*@}"
          name="${REF_NAME%@*}"
          case "$name" in
            @crocs-muni/scrutiny-fabric) dir=packages/core ;;
            @crocs-muni/scrutiny-fabric-mcp) dir=packages/mcp ;;
            *) echo "::error::unknown package in tag $REF_NAME"; exit 1 ;;
          esac
          manifest="$(node -p "require('./$dir/package.json').version")"
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag says $version, $dir/package.json says $manifest"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Go builds the relay for the MCP real-relay e2e below.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pkg.outputs.name == '@crocs-muni/scrutiny-fabric-mcp'
        with:
          go-version-file: relay/go.mod
          cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No caching here: zizmor's cache-poisoning audit rejects package-manager caches in
      # jobs triggered by tag pushes (this workflow). `package-manager-cache: false` is the
      # explicit opt-out (setup-node v5+ enables it by default). The install is ~1 min
      # uncached; the publish gate (`pnpm verify`) dwarfs that.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # The same documented gate CI runs on every PR — a tag publishes only what passes
      # lint, typecheck, rules:check, build, attw, and test on ubuntu.
      - name: Verify
        run: pnpm verify

      # The MCP package against the real relay, and its built bin over stdio (spec §14.1).
      - name: MCP e2e
        if: steps.pkg.outputs.name == '@crocs-muni/scrutiny-fabric-mcp'
        run: pnpm -C packages/mcp run e2e

      # Node 22 on ubuntu-latest ships npm 10; npm CLI >= 11.5.1 is required for trusted
      # publishing. Not a lockfile-managed install (upgrades the global CLI), hence the
      # audit suppression.
      - run: npm i -g npm@11 # zizmor: ignore[adhoc-packages]

      # The MCP package's `workspace:*` dependency becomes core's current version at pack
      # time; publishing it before that core version exists on npm would ship a package that
      # cannot be installed.
      - name: Core version is on npm
        if: steps.pkg.outputs.name == '@crocs-muni/scrutiny-fabric-mcp'
        run: |
          core="$(node -p "require('./packages/core/package.json').version")"
          npm view "@crocs-muni/scrutiny-fabric@$core" version

      # Plain `npm publish`, not `pnpm publish`: the npm CLI is the path npm documents and
      # tests for OIDC trusted publishing. pnpm's publish adds its own git-branch check
      # (tag checkouts are detached HEADs → ERR_PNPM_GIT_UNKNOWN_BRANCH) and its own config
      # handling; neither is wanted here. `publishConfig.access: public` is already in the
      # manifest, provenance is automatic under OIDC, and core has no workspace-protocol
      # dependency to rewrite.
      - name: Publish core
        if: steps.pkg.outputs.name == '@crocs-muni/scrutiny-fabric'
        working-directory: packages/core
        run: npm publish

      # The MCP package does have one (`workspace:*` on core), which only `pnpm pack` rewrites.
      # So pnpm builds the tarball and the npm CLI publishes it, keeping the OIDC exchange in
      # npm. `--ignore-scripts` keeps the publish itself from running any lifecycle script.
      - name: Publish MCP
        if: steps.pkg.outputs.name == '@crocs-muni/scrutiny-fabric-mcp'
        env:
          PACK_DIR: ${{ runner.temp }}/pack
        run: |
          mkdir -p "$PACK_DIR"
          pnpm -C packages/mcp pack --pack-destination "$PACK_DIR"
          npm publish --ignore-scripts "$PACK_DIR"/crocs-muni-scrutiny-fabric-mcp-*.tgz
