version: 2
updates:
  # github-actions only: the devDependency surface here is tiny and not worth the PR noise an
  # npm-scoped feed would add. This exists specifically to keep the SHA pins zizmor requires from
  # going stale.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    # One rollup PR per cycle instead of per-action PRs: the surface is 3 SHA-pinned
    # actions and individual bumps conflict with each other editing the same file.
    groups:
      github-actions:
        patterns:
          - '*'
